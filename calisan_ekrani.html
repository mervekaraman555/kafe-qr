<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafe Personel Ekranı — Masa Siparişleri</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --card: #334155;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --amber: #f59e0b;
    --blue: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; }
  header {
    background: #020617; padding: 16px 24px; border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .title-area h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
  .live-pill {
    background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e;
    padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
  }
  .nav-btns { display: flex; gap: 10px; align-items: center; }
  .nav-btns a {
    background: var(--panel); color: var(--ink); text-decoration: none;
    padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #475569; font-weight: 700;
  }

  /* Garson Zili Çağrı Alanı */
  .calls-container {
    max-width: 1400px; margin: 18px auto 0; padding: 0 20px;
  }
  .calls-box {
    background: rgba(239, 68, 68, 0.16); border: 2px solid var(--red);
    border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 0 28px rgba(239, 68, 68, 0.35);
    animation: staffBoxBlink 0.9s ease-in-out infinite;
  }
  @keyframes staffBoxBlink {
    0%, 100% {
      background: rgba(239, 68, 68, 0.14);
      border-color: #ef4444;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.35);
    }
    50% {
      background: rgba(245, 158, 11, 0.24);
      border-color: #facc15;
      box-shadow: 0 0 34px rgba(250, 204, 21, 0.65);
    }
  }
  .calls-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .calls-title {
    font-size: 1.05rem; font-weight: 800; color: #fca5a5;
    display: flex; align-items: center; gap: 8px;
  }
  .calls-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
  }
  .call-card {
    background: #0f172a; border: 2px solid var(--red); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    animation: callPulse 0.75s ease-in-out infinite;
  }
  @keyframes callPulse {
    0%, 100% {
      border-color: #ef4444;
      background: #0f172a;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      transform: scale(1);
    }
    50% {
      border-color: #facc15;
      background: #3b0d0d;
      box-shadow: 0 0 18px 4px rgba(250, 204, 21, 0.55);
      transform: scale(1.02);
    }
  }
  .call-table-badge {
    background: var(--red); color: #fff; font-weight: 900; font-size: 1rem;
    padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 4px;
    animation: badgeFlash 0.75s ease-in-out infinite;
  }
  @keyframes badgeFlash {
    0%, 100% { background: #ef4444; color: #fff; }
    50% { background: #facc15; color: #020617; }
  }
  .call-reason { font-weight: 700; font-size: 0.9rem; color: #f8fafc; }
  .call-time { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .btn-resolve-call {
    background: var(--green); color: #020617; border: none; padding: 9px 12px;
    border-radius: 8px; font-weight: 800; font-size: 0.82rem; cursor: pointer; white-space: nowrap;
  }

  /* Sadece Masa Siparişleri Tam Genişlik Görünümü */
  .layout { padding: 20px; max-width: 1400px; margin: 0 auto; }

  .section-box { background: var(--panel); border-radius: 16px; padding: 20px; border: 1px solid #334155; }
  .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

  .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .order-card {
    background: #0f172a; border: 2px solid #475569; border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .order-card.bekliyor, .order-card.onaylandi { border-color: var(--amber); box-shadow: 0 0 18px rgba(245,158,11,0.18); }
  .order-card.hazirlaniyor { border-color: var(--blue); }
  .order-card.hazir { border-color: #a855f7; box-shadow: 0 0 18px rgba(168,85,247,0.22); }
  .order-card.tamamlandi { border-color: var(--green); opacity: 0.92; }

  .table-tag {
    font-size: 1.2rem; font-weight: 900; background: var(--amber); color: #020617;
    padding: 5px 14px; border-radius: 8px; display: inline-block;
  }
  .order-card.hazirlaniyor .table-tag { background: var(--blue); }
  .order-card.hazir .table-tag { background: #a855f7; color: #fff; }
  .order-card.tamamlandi .table-tag { background: var(--green); }

  /* Personel Kartı 4 Aşamalı Sıralama İkonları */
  .staff-stepper {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #1e293b;
  }
  .staff-step-btn {
    background: #1e293b;
    border: 1.5px solid #334155;
    border-radius: 10px;
    padding: 8px 4px;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    transition: all 0.15s;
  }
  .staff-step-btn:hover {
    border-color: #64748b;
    color: #f8fafc;
    transform: translateY(-1px);
  }
  .staff-step-btn .st-icon {
    font-size: 1.15rem;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .staff-step-btn.done {
    border-color: #16a34a;
    color: #86efac;
    background: rgba(22, 163, 74, 0.12);
  }
  .staff-step-btn.done .st-icon {
    background: #16a34a;
    color: #fff;
  }
  .staff-step-btn.active {
    border-color: #f59e0b;
    color: #fef08a;
    background: rgba(245, 158, 11, 0.18);
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
  }
  .staff-step-btn.active .st-icon {
    background: #f59e0b;
    color: #020617;
  }
  .staff-step-btn.active.final-done {
    border-color: #22c55e;
    color: #4ade80;
    background: rgba(34, 197, 94, 0.18);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
  }
  .staff-step-btn.active.final-done .st-icon {
    background: #22c55e;
    color: #020617;
  }

  .items-list { margin: 14px 0; font-size: 0.98rem; line-height: 1.6; }
  .items-list div { padding: 5px 0; border-bottom: 1px dashed #1e293b; display: flex; justify-content: space-between; align-items: center; }
  .qty-badge {
    background: #1e293b; color: #fbbf24; font-weight: 900; padding: 2px 8px;
    border-radius: 6px; margin-right: 6px; font-size: 0.92rem;
  }
  .note-box {
    background: rgba(245,158,11,0.12); color: #fcd34d; padding: 8px 10px;
    border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px;
  }
  .action-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-act {
    flex: 1; padding: 10px 12px; border: none; border-radius: 8px;
    font-weight: 800; font-size: 0.86rem; cursor: pointer;
  }
  .btn-prep { background: var(--blue); color: #020617; }
  .btn-done { background: var(--green); color: #020617; }

  /* Kart altı Adisyon ve Ödeme / Masayı Kapat Alanı */
  .card-pay-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #334155;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #090d16;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }
  .card-total-label {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .card-total-val {
    font-size: 1.25rem;
    font-weight: 900;
    color: #4ade80;
  }
  .card-actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .btn-adisyon {
    background: #f59e0b;
    color: #020617;
    border: none;
    padding: 10px 8px;
    border-radius: 9px;
    font-weight: 800;
    font-size: 0.82rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .btn-adisyon:hover {
    background: #fbbf24;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
  }
  .btn-pay-close {
    background: #22c55e;
    color: #020617;
    border: none;
    padding: 10px 8px;
    border-radius: 9px;
    font-weight: 800;
    font-size: 0.82rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .btn-pay-close:hover {
    background: #4ade80;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
  }
  .toast-notification {
    position: fixed;
    top: 24px;
    right: 24px;
    background: #15803d;
    color: #fff;
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.92rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 100000;
    animation: toastIn 0.25s ease;
  }
  @keyframes toastIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="title-area">
    <h1>👨‍🍳 Personel Masa Sipariş Ekranı <span class="live-pill">● CANLI</span> <span id="staffUserBadge" style="font-size:0.8rem; color:#94a3b8; font-weight:600;"></span></h1>
  </div>
  <div class="nav-btns">
    <a href="/adisyon?no=1" onclick="openAdisyonModal(1); return false;" style="background:#f59e0b; color:#020617; border-color:#f59e0b;">🧾 Masa Adisyonları</a>
    <a href="/yetkili" id="yetkiliLink" style="display:none; background:#38bdf8; color:#020617; border-color:#38bdf8;">👔 Yetkili Paneli</a>
    <a href="/giris" onclick="logoutStaff(event)" style="background:rgba(239,68,68,0.18); border-color:#ef4444; color:#fca5a5;">🚪 Çıkış Yap</a>
  </div>
</header>

<div class="calls-container" id="callsWrapper" style="display:none;">
  <div class="calls-box">
    <div class="calls-header">
      <div class="calls-title">🔔 GARSON ZİLİ ÇAĞRILARI (Masadan Çağrı Var!)</div>
      <span id="activeCallsCount" style="font-size:0.82rem; color:#fca5a5; font-weight:700;">0 aktif çağrı</span>
    </div>
    <div class="calls-grid" id="callsGrid"></div>
  </div>
</div>

<div class="layout">
  <div class="section-box">
    <div class="section-title">
      <span>🍽️ Masa Siparişleri (Hangi Masa Ne İstedi?)</span>
      <span id="activeCount" style="font-size:0.88rem; color:var(--muted);">0 aktif masa siparişi</span>
    </div>
    <div class="orders-grid" id="ordersGrid"></div>
  </div>
</div>

<!-- Adisyon Overlay Modal (Pencereli Görünüm) -->
<div id="overlayModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:99999; justify-content:center; align-items:center; padding:16px; backdrop-filter:blur(4px);">
  <div style="position:relative; width:100%; max-width:520px; height:90vh; background:transparent; border-radius:16px; overflow:hidden; box-shadow:0 24px 48px rgba(0,0,0,0.6);">
    <iframe id="overlayIframe" src="about:blank" style="width:100%; height:100%; border:none; background:#fff; border-radius:16px;"></iframe>
  </div>
</div>

<script>
  let knownOrderIds = new Set();
  let knownCallIds = new Set();
  let firstLoad = true;
  let firstCallLoad = true;

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    } catch (e) {}
  }

  function bellSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const notes = [1046.5, 880.0, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.16);
        gain.gain.setValueAtTime(0.25, now + idx * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.16);
        osc.stop(now + idx * 0.16 + 0.35);
      });
    } catch (e) {}
  }

  async function resolveCall(callId) {
    await fetch(`/api/calls/${callId}/resolve`, { method: "POST" });
    loadAllCalls();
  }

  async function loadAllCalls() {
    const res = await fetch("/api/calls");
    if (!res.ok) return;
    const data = await res.json();
    const activeCalls = data.calls.filter(c => c.status === "bekliyor");

    for (const c of activeCalls) {
      if (!knownCallIds.has(c.id)) {
        knownCallIds.add(c.id);
        if (!firstCallLoad) bellSound();
      }
    }
    firstCallLoad = false;

    const wrapper = document.getElementById("callsWrapper");
    const grid = document.getElementById("callsGrid");
    const countEl = document.getElementById("activeCallsCount");

    if (activeCalls.length === 0) {
      wrapper.style.display = "none";
      grid.innerHTML = "";
      return;
    }

    wrapper.style.display = "block";
    countEl.textContent = `${activeCalls.length} aktif çağrı`;
    grid.innerHTML = activeCalls.map(c => `
      <div class="call-card">
        <div>
          <span class="call-table-badge">🔔 MASA ${c.table_no}</span>
          <div class="call-reason">${c.reason}</div>
          <div class="call-time">Saat: ${c.created_at}</div>
        </div>
        <button class="btn-resolve-call" onclick="resolveCall(${c.id})">✅ İlgilenildi</button>
      </div>
    `).join("");
  }

  async function setStatus(orderId, status) {
    await fetch(`/api/orders/${orderId}/status`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status })
    });
    loadAllOrders();
  }

  async function loadAllOrders() {
    const res = await fetch("/api/orders");
    const data = await res.json();
    const active = data.orders.filter(o => o.status !== "odendi");

    const byTableMap = {};
    for (const o of active) {
      const keySig = `${o.id}_${o.updated_at}`;
      if (!knownOrderIds.has(keySig)) {
        knownOrderIds.add(keySig);
        if (!firstLoad) beep();
      }
      const tNo = o.table_no;
      if (!byTableMap[tNo]) {
        byTableMap[tNo] = {
          id: o.id,
          table_no: tNo,
          itemsMap: {},
          notes: [],
          status: o.status,
          total: 0,
          orderCount: 0,
          created_at: o.created_at,
          updated_at: o.updated_at
        };
      }
      const grp = byTableMap[tNo];
      grp.orderCount = (grp.orderCount || 0) + 1;
      grp.total += (o.total || 0);
      if (o.note && !grp.notes.includes(o.note)) grp.notes.push(o.note);
      const rankMap = { bekliyor: 0, onaylandi: 0, hazirlaniyor: 1, hazir: 2, tamamlandi: 3 };
      const rNew = rankMap[o.status] !== undefined ? rankMap[o.status] : 0;
      const rCur = rankMap[grp.status] !== undefined ? rankMap[grp.status] : 0;
      if (rNew < rCur) grp.status = o.status;
      for (const it of o.items) {
        const ikey = `${it.name}_${it.price}`;
        if (!grp.itemsMap[ikey]) {
          grp.itemsMap[ikey] = { name: it.name, price: it.price, qty: 0 };
        }
        grp.itemsMap[ikey].qty += it.qty;
      }
    }
    firstLoad = false;

    const combinedOrders = Object.values(byTableMap).sort((a, b) => a.table_no - b.table_no);
    document.getElementById("activeCount").textContent = `${combinedOrders.length} aktif masa siparişi`;

    const grid = document.getElementById("ordersGrid");
    if (combinedOrders.length === 0) {
      grid.innerHTML = `<p style="color:var(--muted); font-size:0.95rem;">Şu anda bekleyen veya hazırlanan masa siparişi yok.</p>`;
    } else {
      const rankMap = { bekliyor: 0, onaylandi: 0, hazirlaniyor: 1, hazir: 2, tamamlandi: 3 };
      const stages = [
        { key: "onaylandi", idx: 0, icon: "📋", label: "Onaylandı" },
        { key: "hazirlaniyor", idx: 1, icon: "👨‍🍳", label: "Hazırlanıyor" },
        { key: "hazir", idx: 2, icon: "🍽️", label: "Hazır" },
        { key: "tamamlandi", idx: 3, icon: "✅", label: "Teslim Edildi" }
      ];

      grid.innerHTML = combinedOrders.map(o => {
        const itemsList = Object.values(o.itemsMap);
        const itemsHtml = itemsList.map(i => `
          <div>
            <span><span class="qty-badge">${i.qty}x</span> <b>${i.name}</b></span>
            ${i.price ? `<span style="font-size:0.82rem; color:#94a3b8;">${i.price * i.qty} ₺</span>` : ""}
          </div>
        `).join("");
        const curIdx = rankMap[o.status] !== undefined ? rankMap[o.status] : 0;
        let statusBadge = "📋 1/4 — Sipariş Onaylandı";
        if (curIdx === 1) statusBadge = "👨‍🍳 2/4 — Mutfak / Barista Hazırlıyor";
        if (curIdx === 2) statusBadge = "🍽️ 3/4 — Sipariş Hazır (Garson Bekliyor)";
        if (curIdx === 3) statusBadge = "✅ 4/4 — Masaya Teslim Edildi";
        const noteText = o.notes.join(" | ");

        const calcTotal = Object.values(o.itemsMap).reduce((s, i) => s + ((i.price || 0) * i.qty), 0);
        const displayTotal = o.total > 0 ? o.total : calcTotal;

        const stepperBtns = stages.map(s => {
          let cls = "staff-step-btn";
          if (s.idx < curIdx) cls += " done";
          else if (s.idx === curIdx) {
            cls += " active";
            if (curIdx === 3) cls += " final-done";
          }
          return `
            <button type="button" class="${cls}" onclick="setStatus(${o.id}, '${s.key}')">
              <span class="st-icon">${s.idx < curIdx ? "✓" : s.icon}</span>
              <span>${s.idx + 1}. ${s.label}</span>
            </button>
          `;
        }).join("");

        return `
          <div class="order-card ${o.status}">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                  <span class="table-tag">MASA ${o.table_no}</span>
                  ${o.orderCount > 1 ? `<span style="font-size:0.75rem; background:rgba(245,158,11,0.22); color:#fbbf24; border:1px solid #f59e0b; padding:3px 8px; border-radius:8px; font-weight:800;">+${o.orderCount - 1} İlave Sipariş</span>` : ""}
                </div>
                <span style="font-size:0.78rem; color:var(--muted);">Saat: ${o.updated_at}</span>
              </div>
              <div style="font-size:0.82rem; color:var(--muted); margin-top:8px; font-weight:700;">${statusBadge}</div>
              <div class="items-list">${itemsHtml}</div>
              ${noteText ? `<div class="note-box">📝 Sipariş Notu: ${noteText}</div>` : ""}
            </div>
            <div>
              <div style="font-size:0.72rem; color:var(--muted); font-weight:700; margin-bottom:2px;">SİPARİŞ AŞAMASI (Müşteri Ekranında Canlı Görünür):</div>
              <div class="staff-stepper">
                ${stepperBtns}
              </div>
              <div class="card-pay-section">
                <div class="card-total-row">
                  <span class="card-total-label">${o.orderCount > 1 ? "BİRLEŞİK HESAP TOPLAMI:" : "MASA HESAP TOPLAMI:"}</span>
                  <span class="card-total-val">${displayTotal} ₺</span>
                </div>
                <div class="card-actions-grid">
                  <button type="button" class="btn-adisyon" onclick="openAdisyonModal(${o.table_no})">
                    🧾 Adisyon Fişi Oluştur
                  </button>
                  <button type="button" class="btn-pay-close" onclick="payAndCloseTable(${o.table_no}, ${displayTotal})">
                    💳 Ödeme Al & Masayı Kapat
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }
  }

  function openAdisyonModal(tableNo) {
    const modal = document.getElementById("overlayModal");
    const frame = document.getElementById("overlayIframe");
    frame.src = `/adisyon?no=${tableNo}`;
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
  }

  function closeOverlayModal() {
    const modal = document.getElementById("overlayModal");
    const frame = document.getElementById("overlayIframe");
    modal.style.display = "none";
    frame.src = "about:blank";
    document.body.style.overflow = "";
    loadAllOrders();
  }
  window.closeOverlayModal = closeOverlayModal;

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeOverlayModal();
  });

  function showToast(msg) {
    const existing = document.querySelector(".toast-notification");
    if (existing) existing.remove();
    const t = document.createElement("div");
    t.className = "toast-notification";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => {
      t.style.opacity = "0";
      t.style.transition = "opacity 0.3s";
      setTimeout(() => t.remove(), 300);
    }, 3200);
  }

  async function payAndCloseTable(tableNo, total) {
    const onay = confirm(`Masa ${tableNo} için ${total} ₺ tutarındaki hesap tahsil edildi mi?\n\nMasa kapatılacak ve sıradaki yeni müşteriler için hazır hale gelecektir.\nİşlemi onaylıyor musunuz?`);
    if (!onay) return;
    try {
      const res = await fetch(`/api/tables/${tableNo}/pay`, { method: "POST" });
      if (res.ok) {
        showToast(`✅ Masa ${tableNo} hesabı kapatıldı. Masa yeni siparişlere hazır!`);
        await loadAllOrders();
        await loadAllCalls();
      } else {
        alert("Ödeme işlemi tamamlanamadı.");
      }
    } catch (e) {
      alert("Sunucuya bağlanılamadı.");
    }
  }

  async function checkStaffAuth() {
    try {
      const res = await fetch("/api/me");
      if (!res.ok) return;
      const data = await res.json();
      if (!data.user) {
        window.location.href = "/giris";
        return;
      }
      document.getElementById("staffUserBadge").textContent = `· 👤 ${data.user.name}`;
      if (data.user.role === "yetkili") {
        document.getElementById("yetkiliLink").style.display = "inline-block";
      }
    } catch (e) {}
  }

  async function logoutStaff(e) {
    e.preventDefault();
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/giris";
  }

  checkStaffAuth();
  loadAllOrders();
  loadAllCalls();
  setInterval(() => {
    loadAllOrders();
    loadAllCalls();
  }, 2000);
</script>
</body>
</html>
